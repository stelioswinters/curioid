name: CURIOID browser quality

on:
  push:
    branches: [main, curioid-v1.356-cleanup]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: curioid-browser-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate and refresh release integrity in test workspace
        run: |
          node scripts/refresh-release-integrity.cjs
          before="$(git diff --binary | sha256sum | cut -d' ' -f1)"
          node scripts/refresh-release-integrity.cjs
          after="$(git diff --binary | sha256sum | cut -d' ' -f1)"
          test "$before" = "$after"

      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/curioid-http.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/curioid-http.log
          exit 1

      - name: Run Echonoise source audit
        run: node tests/echonoise-static-audit.cjs

      - name: Run KINETA rendering regression audit
        run: node tests/kineta-static-audit.cjs

      - name: Run animated garden rendering cache audit
        run: node tests/garden-render-cache-audit.cjs

      - name: Run full browser smoke suite
        run: node tests/browser-smoke.cjs

      - name: Package verified CURIOID website
        run: |
          zip -q curioid-v1.356-site.zip \
            _headers robots.txt sitemap.xml social-preview.png \
            index.html site-runtime-current.js service-worker-current.js manifest.webmanifest \
            curioid-icon.svg curioid-icon-192.png curioid-icon-512.png \
            health-check.js projects-core.js projects-styles.css \
            projects-category-creative-tools.js projects-category-digital-art.js \
            projects-category-operating-systems.js projects-category-sound-motion.js \
            projects-category-strange-archives.js projects-category-tiny-games.js \
            projects-category-web-experiments.js \
            music-audio-apps.html applications-tools-apps.html chroma-loom.html curioids.html \
            dark-looper-app.js glitchyard-app.js vanta-deck-app.js \
            vocal-lexicon.js vocal-lexicon-data.json

      - name: Upload verified CURIOID website ZIP
        uses: actions/upload-artifact@v4
        with:
          name: curioid-v1.356-site
          path: curioid-v1.356-site.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload local server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: curioid-static-server-log
          path: /tmp/curioid-http.log
          if-no-files-found: ignore
