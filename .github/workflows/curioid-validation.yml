name: CURIOID Static Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: curioid-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Syntax, release and integrity checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Parse every JavaScript file
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            node --check "$file"
            count=$((count + 1))
          done < <(find . -type f -name '*.js' -not -path './.git/*' -print0)
          echo "Successfully parsed $count JavaScript files."

      - name: Verify release alignment and every offline asset hash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';

          const read = file => fs.readFileSync(file, 'utf8');
          const fail = message => { console.error('FAIL:', message); process.exitCode = 1; };
          const assert = (condition, message) => { if (!condition) fail(message); };
          const index = read('index.html');
          const indexHash = crypto.createHash('sha256').update(fs.readFileSync('index.html')).digest('hex');
          console.log(`Computed index.html SHA-256: ${indexHash}`);
          const homepageHash = crypto.createHash('sha256').update(fs.readFileSync('index.html')).digest('hex');
          console.log(`Computed homepage SHA-256: ${homepageHash}`);
          const health = read('health-check.js');
          const worker = read('service-worker-current.js');
          const runtime = read('site-runtime-current.js');

          const release = worker.match(/const RELEASE_ID\s*=\s*['"]([^'"]+)['"]/)?.[1];
          const healthRelease = health.match(/EXPECTED_RELEASE\s*=\s*['"]([^'"]+)['"]/)?.[1];
          const pageRelease = index.match(/<meta\s+name="curioid-release"\s+content="([^"]+)"/)?.[1];
          assert(Boolean(release), 'Service worker release ID is missing.');
          assert(release === healthRelease, `Health Check expects ${healthRelease}, worker is ${release}.`);
          assert(release === pageRelease, `Homepage expects ${pageRelease}, worker is ${release}.`);

          const runtimeVersions = [...runtime.matchAll(/v1\.\d+/g)].map(match => match[0]);
          assert(runtimeVersions.length > 0, 'Runtime contains no explicit worker release references.');
          assert(runtimeVersions.every(version => version === release), 'Runtime contains stale or mixed release references.');

          const manifestMatch = worker.match(/const EXPECTED_SHA256\s*=\s*Object\.freeze\((\{[\s\S]*?\})\);/);
          assert(Boolean(manifestMatch), 'Offline SHA-256 manifest is missing.');
          if (manifestMatch) {
            let manifest;
            try { manifest = JSON.parse(manifestMatch[1].replace(/,\s*}/g, '}')); }
            catch (error) { fail(`Offline SHA-256 manifest is invalid JSON: ${error.message}`); }
            if (manifest) {
              for (const [file, expected] of Object.entries(manifest)) {
                if (!fs.existsSync(file)) { fail(`Manifest asset is missing: ${file}`); continue; }
                const actual = crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
                if (actual !== expected) fail(`SHA-256 mismatch for ${file}: expected ${expected}, got ${actual}`);
              }
              console.log(`Verified ${Object.keys(manifest).length} offline asset hashes.`);
              for (const required of ['index.html', 'health-check.js', 'site-runtime-current.js']) {
                assert(Boolean(manifest[required]), `Required asset is absent from offline manifest: ${required}`);
              }
            }
          }

          const runtimeHash = crypto.createHash('sha256').update(fs.readFileSync('site-runtime-current.js')).digest('hex');
          const runtimeSri = 'sha384-' + crypto.createHash('sha384').update(fs.readFileSync('site-runtime-current.js')).digest('base64');
          console.log(`Computed runtime SHA-256: ${runtimeHash}`);
          console.log(`Computed runtime SRI: ${runtimeSri}`);
          const runtimeTags = index.match(/<(?:link|script)\b[^>]*(?:href|src)="site-runtime-current\.js\?v=sha256-[a-f0-9]{64}"[^>]*>/g) || [];
          assert(runtimeTags.length === 2, `Expected runtime preload and script tags, found ${runtimeTags.length}.`);
          for (const tag of runtimeTags) {
            assert(tag.includes(`sha256-${runtimeHash}`), 'Runtime URL cache hash is stale.');
            assert(tag.includes(`integrity="${runtimeSri}"`), 'Runtime SRI does not match the deployed runtime bytes.');
          }
          assert(manifestMatch && (() => {
            try { const manifest = JSON.parse(manifestMatch[1].replace(/,\s*}/g, '}')); return manifest['site-runtime-current.js'] === runtimeHash; }
            catch { return false; }
          })(), 'Offline manifest runtime hash does not match runtime bytes.');

          const healthBytes = fs.readFileSync('health-check.js');
          const healthHash = crypto.createHash('sha256').update(healthBytes).digest('hex');
          const healthSri = 'sha384-' + crypto.createHash('sha384').update(healthBytes).digest('base64');
          console.log(`Computed health-check.js SHA-256: ${healthHash}`);
          console.log(`Computed health-check.js SRI: ${healthSri}`);
          const healthHashDescriptor = runtime.match(/const HEALTH_MODULE_HASH\s*=\s*['"]([a-f0-9]{64})['"]/)?.[1];
          const healthSriDescriptor = runtime.match(/const HEALTH_MODULE_SRI\s*=\s*['"](sha384-[^'"]+)['"]/)?.[1];
          assert(healthHashDescriptor === healthHash, 'Health Check lazy-loader SHA-256 descriptor does not match health-check.js.');
          assert(healthSriDescriptor === healthSri, 'Health Check lazy-loader SRI does not match health-check.js.');

          // Verify the exact inline bootstrap hashes protected by each app page CSP.
          for (const file of ['music-audio-apps.html', 'applications-tools-apps.html']) {
            const html = read(file);
            const cspTag = html.match(/<meta\b[^>]*http-equiv="Content-Security-Policy"[^>]*>/i)
              || html.match(/<meta\b[^>]*content="[^"]*"[^>]*http-equiv="Content-Security-Policy"[^>]*>/i);
            const policy = cspTag?.[0].match(/\bcontent="([^"]+)"/i)?.[1] || '';
            const scriptSrc = policy.split(';').map(part => part.trim()).find(part => part.startsWith('script-src')) || '';
            const approved = new Set([...scriptSrc.matchAll(/'sha256-([^']+)'/g)].map(match => match[1]));
            const inlineScripts = [...html.matchAll(/<script[^>]*>([\s\S]*?)<\/script>/gi)];
            assert(inlineScripts.length >= 2, file + ' has fewer inline bootstrap scripts than expected.');
            inlineScripts.forEach((match, index) => {
              const hash = crypto.createHash('sha256').update(match[1]).digest('base64');
              assert(approved.has(hash), file + ' inline script ' + (index + 1) + ' is blocked by its own Content Security Policy (SHA-256 ' + hash + ').');
            });
            console.log(file + ': ' + inlineScripts.length + ' CSP-approved inline scripts.');
          }
          for (const [file, scriptPath] of [['music-audio-apps.html', 'dark-looper-app.js'], ['applications-tools-apps.html', 'vanta-deck-app.js']]) {
            const html = read(file);
            const appSri = html.match(/const integrity='(sha384-[^']+)'/)?.[1]
              || html.match(/'vanta-deck-app.js':'(sha384-[^']+)'/)?.[1];
            assert(Boolean(appSri), `${file} is missing the app script integrity value for ${scriptPath}.`);
            const actualSri = 'sha384-' + crypto.createHash('sha384').update(fs.readFileSync(scriptPath)).digest('base64');
            console.log(scriptPath + ' computed SRI: ' + actualSri);
            assert(appSri === actualSri, `${file} app script SRI does not match ${scriptPath}.`);
          }
          assert(manifestMatch && (() => {
            try { const manifest = JSON.parse(manifestMatch[1].replace(/,\s*}/g, '}')); return manifest['health-check.js'] === healthHash; }
            catch { return false; }
          })(), 'Offline manifest Health Check hash does not match health-check.js.');

          const categoryDescriptors = [...runtime.matchAll(/"([^"]+)": \{ file: "([^"]+)", hash: "([a-f0-9]{64})", integrity: "(sha384-[^"]+)" \}/g)];
          assert(categoryDescriptors.length === 7, `Expected 7 category integrity descriptors, found ${categoryDescriptors.length}.`);
          for (const [, category, file, expectedHash, expectedSri] of categoryDescriptors) {
            if (!fs.existsSync(file)) { fail(`${category} category bundle is missing: ${file}`); continue; }
            const bytes = fs.readFileSync(file);
            const hash = crypto.createHash('sha256').update(bytes).digest('hex');
            const sri = 'sha384-' + crypto.createHash('sha384').update(bytes).digest('base64');
            assert(hash === expectedHash, `${category} category SHA-256 descriptor is stale.`);
            assert(sri === expectedSri, `${category} category SRI descriptor is stale.`);
          }

          const cssHash = runtime.match(/const PROJECT_STYLES_SHA256\s*=\s*["']([a-f0-9]{64})["']/)?.[1];
          const cssSri = runtime.match(/const PROJECT_STYLES_SRI\s*=\s*["'](sha384-[^"']+)["']/)?.[1];
          if (cssHash && cssSri && fs.existsSync('projects-styles.css')) {
            const css = fs.readFileSync('projects-styles.css');
            console.log('Computed projects-styles.css SHA-256: ' + crypto.createHash('sha256').update(css).digest('hex'));
            console.log('Computed projects-styles.css SRI: sha384-' + crypto.createHash('sha384').update(css).digest('base64'));
            assert(crypto.createHash('sha256').update(css).digest('hex') === cssHash, 'Project stylesheet SHA-256 descriptor is stale.');
            assert('sha384-' + crypto.createHash('sha384').update(css).digest('base64') === cssSri, 'Project stylesheet SRI descriptor is stale.');
          } else fail('Project stylesheet integrity descriptors or file are missing.');

          const sizeBudgets = {
            'index.html': 180 * 1024,
            'site-runtime-current.js': 320 * 1024,
            'projects-core.js': 2 * 1024 * 1024,
            'projects-category-operating-systems.js': 2.3 * 1024 * 1024,
            'projects-styles.css': 1.1 * 1024 * 1024
          };
          for (const [file, budget] of Object.entries(sizeBudgets)) {
            if (!fs.existsSync(file)) { fail(`Performance budget target is missing: ${file}`); continue; }
            const bytes = fs.statSync(file).size;
            assert(bytes <= budget, `${file} exceeds its ${Math.round(budget / 1024)} KiB performance budget (${Math.round(bytes / 1024)} KiB).`);
            console.log(`Bundle budget: ${file} ${Math.round(bytes / 1024)} / ${Math.round(budget / 1024)} KiB.`);
          }

          console.log(`Release ${release}: release markers, runtime SRI, category SRI and offline hashes checked.`);
          NODE

      - name: Install Chromium for real-browser smoke tests
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run CURIOID browser smoke tests
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >/tmp/curioid-http.log 2>&1 &
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer
          class PagesLikeHandler(SimpleHTTPRequestHandler):
              def do_GET(self):
                  # Keep the canonical deployment base local so lazy modules and
                  # same-origin diagnostics are tested against this checkout.
                  if self.path.split("?", 1)[0] == "/":
                      with open("index.html", "rb") as source:
                          html = source.read().replace(
                              b'href="https://stelioswinters.com/curioid/"',
                              b'href="http://127.0.0.1:4173/"'
                          )
                      self.send_response(200)
                      self.send_header("Content-Type", "text/html; charset=utf-8")
                      self.send_header("Content-Length", str(len(html)))
                      self.end_headers()
                      self.wfile.write(html)
                      return
                  super().do_GET()
              def end_headers(self):
                  # GitHub Pages serves public static assets with wildcard CORS.
                  self.send_header("Access-Control-Allow-Origin", "*")
                  super().end_headers()
          ThreadingHTTPServer(("127.0.0.1", 4173), PagesLikeHandler).serve_forever()
          PY
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          node tests/browser-smoke.cjs
