name: Keep Latest Workflow Run Only

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          runs=$(gh api "repos/$REPO/actions/runs?per_page=100" --jq '.workflow_runs[].id')
          echo "$runs" | tail -n +2 | while read -r id; do
            [ -n "$id" ] && gh api -X DELETE "repos/$REPO/actions/runs/$id" --silent
          done