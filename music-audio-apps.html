<title>CURIOID</title>
<style>
:root {
  color-scheme: dark;
  --bg: #070809;
  --panel: #101213;
  --panel-2: #151819;
  --line: rgba(235, 224, 200, .11);
  --line-strong: rgba(163, 230, 53, .3);
  --ink: #f4f0e6;
  --ink-soft: #c4bfb3;
  --muted: #84847c;
  --gold: #a3e635;
  --gold-bright: #bef264;
  --gold-deep: #4d7c0f;
  --gold-wash: rgba(163, 230, 53, .14);
  --rust: #9e4339;
  --crimson: #c93b2b;
  --font-display: "Cinzel", Georgia, serif;
  --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; background: var(--bg); }
body {
  margin: 0; min-height: 100vh;
  color: var(--ink); background: var(--bg);
  font-family: var(--font-body);
  display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start;
  padding: 14px 10px 20px;
}
.mpc-card {
  position: relative; isolation: isolate; padding: 1.5rem; width: min(100%, 920px); overflow: hidden;
  border: 1px solid rgba(163, 230, 53, .3); border-radius: 12px;
  background: linear-gradient(140deg, rgba(24, 25, 27, .98), rgba(9, 10, 12, .99));
  box-shadow: 0 36px 96px rgba(0, 0, 0, .82), inset 0 1px 0 rgba(190, 242, 100, .1);
}
.mpc-header {
  display: flex; align-items: center; justify-content: space-between; gap: .75rem;
  padding-bottom: .8rem; margin-bottom: .85rem;
  border-bottom: 1px solid rgba(163, 230, 53, .15);
}
.mpc-label { color: var(--gold); font: 600 .7rem var(--font-mono); letter-spacing: .13em; }
.mpc-leds { display: flex; align-items: center; gap: .5rem; }
.mpc-led {
  width: 9px; height: 9px; border: 1px solid #365314; border-radius: 50%;
  background: #1c160d;
  transition: background .18s ease, box-shadow .18s ease;
}
.mpc-led.active {
  border-color: var(--gold-bright); background: var(--gold);
  box-shadow: 0 0 6px var(--gold), 0 0 14px rgba(163, 230, 53, .7);
}
.mpc-led.rec.active {
  border-color: #ff7b6b; background: var(--crimson);
  box-shadow: 0 0 7px var(--crimson), 0 0 16px rgba(201, 59, 43, .8);
}
.mpc-screen {
  position: relative; padding: 1rem 1.1rem; margin-bottom: 1rem; overflow: hidden;
  border: 1px solid rgba(163, 230, 53, .35); border-radius: 6px;
  background: linear-gradient(115deg, #060708, #11120e 58%, #090a0b);
  box-shadow: inset 0 0 30px rgba(0, 0, 0, .92);
}
.mpc-screen-title {
  position: relative; z-index: 1; min-height: 1.4em; margin-bottom: .4rem;
  color: var(--gold-bright); font: 500 .75rem/1.45 var(--font-mono); letter-spacing: .05em;
}
.mpc-screen-meta {
  position: relative; z-index: 1; display: flex; justify-content: space-between; flex-wrap: wrap;
  gap: .3rem .7rem; color: #8f8c82; font: .6rem var(--font-mono); letter-spacing: .06em;
}
.step-strip {
  position: relative; z-index: 1;
  display: grid; grid-template-columns: repeat(16, minmax(0, 1fr));
  gap: 4px; margin-top: .8rem;
}
.step-pip {
  height: 20px; border-radius: 2px; cursor: pointer;
  background: rgba(163, 230, 53, .15);
  transition: background .08s ease, box-shadow .08s ease;
}
.step-pip:hover { background: rgba(163, 230, 53, .35); }
.step-pip.has-note { background: rgba(163, 230, 53, .55); }
.step-pip.is-current {
  background: var(--gold-bright);
  box-shadow: 0 0 10px rgba(190, 242, 100, .9);
}
.pads-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .6rem; margin-bottom: 1rem; }
.pad {
  position: relative; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: .3rem;
  aspect-ratio: 1.15 / 1; padding: .7rem .65rem;
  border: 1px solid rgba(163, 230, 53, .25); border-radius: 6px; color: #d5cfc3;
  background: linear-gradient(155deg, #1d2022 0%, #111315 55%, #090a0c 100%);
  cursor: pointer; user-select: none; text-align: left;
  box-shadow: inset 0 1px 0 rgba(190, 242, 100, .08), inset 0 -3px 0 rgba(0, 0, 0, .55), 0 4px 10px rgba(0, 0, 0, .45);
  transition: transform .08s ease, border-color .14s ease, color .14s ease, background .14s ease;
}
.pad::before {
  position: absolute; top: 6px; right: 7px; width: 5px; height: 5px;
  border: 1px solid rgba(163, 230, 53, .5); border-radius: 50%; content: ""; background: #1d160c;
}
.pad.has-seq::before {
  border-color: var(--gold-bright); background: var(--gold);
  box-shadow: 0 0 6px rgba(163, 230, 53, .65);
}
.pad strong { color: #87847a; font: 500 .58rem var(--font-mono); letter-spacing: .08em; }
.pad span { max-width: 100%; color: #ddd6c9; font: 600 .68rem/1.25 var(--font-mono); overflow-wrap: anywhere; }
.pad:hover { border-color: rgba(163, 230, 53, .75); color: #fff8ea; }
.pad:active, .pad.hit {
  transform: translateY(1px) scale(.97);
  border-color: var(--gold-bright); color: var(--gold-bright);
  background: linear-gradient(145deg, #283618, #171410 74%);
  box-shadow: inset 0 0 18px rgba(163, 230, 53, .25);
}
.mpc-controls { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: .4rem; margin-bottom: .8rem; }
.mpc-controls button {
  min-height: 42px; padding: .4rem;
  border: 1px solid rgba(163, 230, 53, .3); border-radius: 6px;
  color: #ccc6b9; background: linear-gradient(180deg, #171a1c, #0d0f11);
  cursor: pointer; font: 500 .58rem var(--font-mono); letter-spacing: .04em; text-transform: uppercase;
  transition: all .2s ease; display: flex; align-items: stretch; justify-content: flex-start; text-align: center;
}
.mpc-controls button:hover:not(:disabled) { border-color: var(--gold); color: var(--gold-bright); }
.mpc-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
.mpc-controls button.playing {
  border-color: var(--gold-bright); color: #111;
  background: linear-gradient(135deg, #bef264, #a3e635); font-weight: 700;
}
.mpc-controls button.recording {
  border-color: #ff7b6b; color: #fff;
  background: linear-gradient(135deg, #c93b2b, #7d1d13);
  box-shadow: 0 0 16px rgba(201, 59, 43, .45);
}
.mpc-controls button.edit-mode-active {
  border-color: var(--gold-bright); background: rgba(163, 230, 53, .2); color: var(--gold-bright);
}
/* Tempo Slider Section */
.tempo-section {
  display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 0.8rem;
  background: #0f1214; border: 1px solid rgba(163, 230, 53, .3); border-radius: 6px;
  font-family: var(--font-mono); font-size: 0.7rem; color: var(--gold-bright);
}
.tempo-section label { white-space: nowrap; font-weight: 600; letter-spacing: 0.08em; }
.tempo-slider {
  flex: 1; -webkit-appearance: none; appearance: none; height: 6px; background: #1c2217;
  border-radius: 3px; outline: none; border: 1px solid rgba(163, 230, 53, .2);
}
.tempo-slider::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 50%;
  background: var(--gold); cursor: pointer; box-shadow: 0 0 8px var(--gold);
}
.tempo-slider::-moz-range-thumb {
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--gold); cursor: pointer; border: none; box-shadow: 0 0 8px var(--gold);
}
.tempo-readout { min-width: 38px; text-align: right; font-weight: bold; color: var(--gold); }
/* Modal Popup & Sound Selection */
.modal-overlay {
  position: fixed; inset: 0; z-index: 2000; display: none; place-items: center;
  background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(4px); padding: 1rem;
}
.modal-overlay.is-open { display: grid; }
.modal-content {
  width: min(100%, 500px); max-height: 85vh; display: flex; flex-direction: column;
  background: #111315; border: 1px solid var(--gold); border-radius: 8px; padding: 1.25rem;
  box-shadow: 0 20px 40px rgba(0,0,0,0.8);
}
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
.modal-header h3 { margin: 0; font-family: var(--font-display); color: var(--gold-bright); font-size: 1.1rem; }
.modal-close { background: transparent; border: none; color: var(--muted); font-size: 1.2rem; cursor: pointer; }
.modal-search {
  width: 100%; padding: 0.6rem 0.8rem; background: #070809; border: 1px solid rgba(163, 230, 53, .3);
  border-radius: 4px; color: var(--ink); font-size: 0.85rem; margin-bottom: 1rem; outline: none;
}
.modal-search:focus { border-color: var(--gold-bright); }
.sound-list-container { overflow-y: auto; display: flex; flex-direction: column; gap: 0.4rem; max-height: 280px; padding-right: 4px; margin-bottom: 1rem; }
.sound-category-title { font-size: 0.65rem; font-family: var(--font-mono); color: var(--gold); letter-spacing: 0.1em; margin-top: 0.5rem; text-transform: uppercase; }
.sound-item-row {
  display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0.75rem;
  background: #181b1d; border: 1px solid var(--line); border-radius: 4px; color: var(--ink);
  cursor: pointer; font-family: var(--font-mono); font-size: 0.75rem;
  transition: background 0.15s ease, border-color 0.15s ease;
}
.sound-item-row:hover, .sound-item-row.selected { background: rgba(163, 230, 53, 0.15); border-color: var(--gold); color: var(--gold-bright); }
.modal-footer { display: flex; justify-content: flex-end; gap: 0.5rem; }
.modal-footer button { padding: 0.6rem 1.2rem; background: var(--gold); color: #111; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; font-family: var(--font-mono); font-size: 0.75rem; text-transform: uppercase; }
.modal-footer button:hover { background: var(--gold-bright); }
/* Recording Action Popup */
.rec-popup-overlay {
  position: fixed; inset: 0; z-index: 2500; display: none; place-items: center;
  background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(5px); padding: 1rem;
}
.rec-popup-overlay.is-open { display: grid; }
.rec-popup-content {
  width: min(100%, 400px); background: #111315; border: 1px solid var(--crimson); border-radius: 8px; padding: 1.5rem; text-align: center;
  box-shadow: 0 25px 50px rgba(0,0,0,0.9);
}
.rec-popup-content h3 { margin-top: 0; font-family: var(--font-display); color: #ff7b6b; font-size: 1.2rem; }
.rec-popup-content p { color: var(--ink-soft); font-size: 0.85rem; margin-bottom: 1.5rem; }
.rec-popup-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
.rec-popup-actions button { padding: 0.75rem; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-family: var(--font-mono); font-size: 0.75rem; text-transform: uppercase; }
.btn-download-rec { background: var(--gold); color: #111; }
.glitchyard-loader>span:not(.glitchyard-loader-mark){color:var(--muted,#91a0a8);font-size:12px}
.glitchyard-loader-error>p{max-width:560px;color:var(--muted,#91a0a8);font-size:12px;line-height:1.6;overflow-wrap:anywhere}
</style>

<body>
<section class="studio-app" data-studio-app="dark-looper" hidden="" id="studio-looper">
<div aria-label="Interactive D4RK L00P3R Groove Box" class="mpc-card" role="region">
<div class="mpc-header">
<span class="mpc-label">D4RK L00P3R // ANALOG NIGHTSHIFT</span>
<div class="mpc-leds">
<span aria-label="Record standby" class="mpc-led rec" id="mpcRecLed"></span>
<span aria-label="Looper stopped" class="mpc-led" id="mpcLed"></span>
</div>
</div>
<div class="mpc-screen">
<div aria-atomic="true" aria-live="polite" class="mpc-screen-title" id="mpcStatus" role="status">READY - TAP A PAD, BUILD A LOOP, MAKE NOISE</div>
<div class="mpc-screen-meta">
<span id="mpcModeLabel">MODE: STANDARD // BAR 01</span>
<span id="tempoDisplay">16-STEP SEQUENCER // 88 BPM</span>
</div>
<div aria-hidden="true" class="step-strip" id="stepStrip"></div>
</div>
<!-- 12 Pads Grid -->
<div aria-label="Twelve customizable instrument pads" class="pads-grid" id="padsGrid">
<button aria-label="Pad 1" class="pad" data-index="0" data-sound="kick" type="button"><strong>PAD 01</strong><span>DARK KICK</span></button>
<button aria-label="Pad 2" class="pad" data-index="1" data-sound="snare" type="button"><strong>PAD 02</strong><span>DUST SNARE</span></button>
<button aria-label="Pad 3" class="pad" data-index="2" data-sound="closedhat" type="button"><strong>PAD 03</strong><span>CLOSED HAT</span></button>
<button aria-label="Pad 4" class="pad" data-index="3" data-sound="sub" type="button"><strong>PAD 04</strong><span>SUB BASS</span></button>
<button aria-label="Pad 5" class="pad" data-index="4" data-sound="rim" type="button"><strong>PAD 05</strong><span>RIMSHOT</span></button>
<button aria-label="Pad 6" class="pad" data-index="5" data-sound="openhat" type="button"><strong>PAD 06</strong><span>OPEN HAT</span></button>
<button aria-label="Pad 7" class="pad" data-index="6" data-sound="metal" type="button"><strong>PAD 07</strong><span>METAL HIT</span></button>
<button aria-label="Pad 8" class="pad" data-index="7" data-sound="vinyl" type="button"><strong>PAD 08</strong><span>VINYL DUST</span></button>
<button aria-label="Pad 9" class="pad" data-index="8" data-sound="drone" type="button"><strong>PAD 09</strong><span>DARK DRONE</span></button>
<button aria-label="Pad 10" class="pad" data-index="9" data-sound="impact" type="button"><strong>PAD 10</strong><span>LOW IMPACT</span></button>
<button aria-label="Pad 11" class="pad" data-index="10" data-sound="reverse" type="button"><strong>PAD 11</strong><span>REVERSE AIR</span></button>
<button aria-label="Pad 12" class="pad" data-index="11" data-sound="tape" type="button"><strong>PAD 12</strong><span>TAPE STOP</span></button>
</div>
<div class="mpc-controls">
<button aria-pressed="false" id="loopToggle" type="button">Play Loop</button>
<button aria-pressed="false" id="recToggle" type="button">Overdub: ON</button>
<button aria-pressed="false" id="editModeToggle" type="button">Edit: OFF</button>
<button aria-pressed="false" id="liveRecordBtn" type="button">Live Rec</button>
<button id="clearBtn" type="button">Clear</button>
</div>
<!-- Interactive BPM Slider Control -->
<div class="tempo-section">
<label for="tempoSlider">BPM</label>
<input class="tempo-slider" id="tempoSlider" max="200" min="40" step="1" type="range" value="88"/>
<span class="tempo-readout" id="tempoReadout">88</span>
</div>
</div>
<!-- Sound Selection Modal Popup with Expanded Library -->
<div aria-hidden="true" class="modal-overlay" id="soundModal">
<div class="modal-content">
<div class="modal-header">
<h3 id="modalTitle">Select Sound</h3>
<button class="modal-close" id="modalClose" type="button">×</button>
</div>
<input class="modal-search" id="soundSearch" aria-label="Search expanded sound library" placeholder="Search expanded sound library..." type="text"/>
<div class="sound-list-container" id="soundListContainer"></div>
<div class="modal-footer">
<button id="modalSelectBtn" type="button">SELECT</button>
</div>
