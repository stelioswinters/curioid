  <script id="curioid-frame-guard">
(() => {
  let blocked = false;
  try {
    blocked = window.top !== window.self && window.top.location.origin !== window.location.origin;
  } catch (_) {
    blocked = true;
  }
  if (!blocked) return;

  const cancelInteraction = event => {
    if (event.cancelable) event.preventDefault();
    event.stopImmediatePropagation();
  };
  const blockedEvents = [
    'click', 'auxclick', 'dblclick', 'contextmenu', 'submit', 'reset',
    'beforeinput', 'input', 'change', 'focus', 'focusin', 'keydown', 'keypress', 'keyup',
    'pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup',
    'touchstart', 'touchend', 'dragstart', 'drop'
  ];
  for (const type of blockedEvents) {
    window.addEventListener(type, cancelInteraction, { capture: true, passive: false });
  }

  const showFrameWarning = () => {
    if (document.body) document.body.inert = true;
    if (document.getElementById('curioid-frame-warning')) return;
    const panel = document.createElement('section');
    panel.id = 'curioid-frame-warning';
    panel.setAttribute('role', 'alert');
    panel.setAttribute('aria-live', 'assertive');

    message.style.cssText = 'max-width:48ch;margin:0;color:#d2d0dc;';
    panel.append(heading, message);
    document.documentElement.append(panel);
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', showFrameWarning, { once: true });
  } else {
    showFrameWarning();

<script>
(() => {
  const COLORS = 8;
  const START_MOVES = 13;
  const EXPAND_MOVES = 8;
  const TILE = 34;
  const NORMAL = 0, PRISM = 1, VOID = 2, ANCHOR = 3, WALL = 4;
  const GLYPHS = ["●", "▲", "■", "◆", "★", "✚", "◉", "❖"];
  const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  const NOTES = [261.63, 293.66, 329.63, 392, 440, 523.25, 587.33, 659.25];

  const PALETTES = {
    kyoto:      { bg: "#0b0d12", c: ["#e11d48","#2563eb","#eab308","#10b981","#9333ea","#ec4899","#06b6d4","#f8fafc"] },
    bauhaus:    { bg: "#0d0f14", c: ["#dc2626","#1d4ed8","#facc15","#0d9488","#7c3aed","#db2777","#65a30d","#e2e8f0"] },
    aurora:     { bg: "#070a12", c: ["#10b981","#ef4444","#a855f7","#eab308","#2563eb","#f43f5e","#c084fc","#f8fafc"] },
    terracotta: { bg: "#0f0d0b", c: ["#c2410c","#0f766e","#eab308","#4338ca","#be185d","#4d7c0f","#7c3aed","#38bdf8"] }
  };

  let audioCtx = null, soundOn = true;
  function beep(count, combo, anchor) {
    if (!soundOn) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!audioCtx) audioCtx = new AC();
    if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = anchor ? "sine" : "triangle";
    osc.frequency.setValueAtTime(NOTES[Math.min(7, count + combo)] * (anchor ? 1.5 : 1), t);
    gain.gain.setValueAtTime(0.05, t);
    gain.gain.exponentialRampToValueAtTime(0.0008, t + 0.2);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t); osc.stop(t + 0.21);
  }

  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d", { alpha: false });
  const viewport = document.getElementById("viewport");
  const art = document.createElement("canvas");
  const actx = art.getContext("2d");
  const wallStamp = document.createElement("canvas");
  const wctx = wallStamp.getContext("2d");
  let wallStampSize = 0;

  const ui = {
    moves: document.getElementById("uiMoves"),
    ring: document.getElementById("uiRing"),
    bar: document.getElementById("uiBar"),
    area: document.getElementById("uiArea"),
    score: document.getElementById("uiScore"),
    threat: document.getElementById("uiThreat"),
    palette: document.getElementById("uiPalette"),
    weave: document.getElementById("uiWeave"),
    undo: document.getElementById("uiUndo"),
    hints: document.getElementById("uiHints"),
    glyphs: document.getElementById("uiGlyphs"),
    sound: document.getElementById("uiSound"),
    save: document.getElementById("uiSave"),
    reset: document.getElementById("uiReset"),
    zoomIn: document.getElementById("uiZoomIn"),
    zoomOut: document.getElementById("uiZoomOut"),
    center: document.getElementById("uiCenter"),
    swatches: document.getElementById("uiSwatches"),
    toast: document.getElementById("toast"),
    modal: document.getElementById("modal"),
    mTitle: document.getElementById("mTitle"),
    mDesc: document.getElementById("mDesc"),
    mRing: document.getElementById("mRing"),
    mTiles: document.getElementById("mTiles"),
    mScore: document.getElementById("mScore"),
    mSave: document.getElementById("mSave"),
    mRetry: document.getElementById("mRetry")
  };

  let grid = { bound: 6, stride: 13, color: null, owned: null, special: null, seed: null };
  let scratch = { vis: null, qx: null, qy: null };
  let dirty = new Set(), fullRebuild = true, frameScheduled = false;
  let history = [];

  let state = {
    palette: "kyoto", weave: "geo", hints: false, glyphs: false,
    ring: 1, moves: START_MOVES, score: 0, combo: 0, turns: 0,
    currentColor: 0, gameOver: false,
    camX: 0, camY: 0, zoom: 1.1,
    dragging: false, lx: 0, ly: 0, scx: 0, scy: 0
  };

  function h2(x, y, s) {
    let n = (x * 374761393 + y * 668265263 + s * 1442695041) | 0;
    n = Math.imul(n ^ (n >>> 13), 1274126177);
    return ((n ^ (n >>> 16)) >>> 0) & 255;
  }

  function idx(x, y, b = grid.bound) { return (y + b) * (b * 2 + 1) + (x + b); }
  function inside(x, y, b = grid.bound) { return x >= -b && x <= b && y >= -b && y <= b; }
  function targetRatio(ring) { return Math.min(0.62, 0.48 + (ring - 1) * 0.02); }

  function scheduleDraw() {
    if (!frameScheduled) {
      frameScheduled = true;
      requestAnimationFrame(() => {
        frameScheduled = false;
        draw();
      });
    }
  }

  let toastTimer = null;
  function toast(msg) {
    ui.toast.textContent = msg;
    ui.toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => ui.toast.classList.remove("show"), 2000);
  }

  function ensureScratch(len) {
    if (!scratch.vis || scratch.vis.length < len) {
      scratch.vis = new Uint8Array(len);
      scratch.qx = new Int16Array(len);
      scratch.qy = new Int16Array(len);
    }
  }

  function alloc(newBound, old) {
    const stride = newBound * 2 + 1;
    const len = stride * stride;
    ensureScratch(len);

    const color = new Uint8Array(len);
    const owned = new Uint8Array(len);
    const special = new Uint8Array(len);
    const seed = new Uint8Array(len);

    for (let y = -newBound; y <= newBound; y++) {
      for (let x = -newBound; x <= newBound; x++) {
        const d = (y + newBound) * stride + (x + newBound);
        if (old && inside(x, y, old.bound)) {
          const s = idx(x, y, old.bound);
          color[d] = old.color[s]; owned[d] = old.owned[s];
          special[d] = old.special[s]; seed[d] = old.seed[s];
        } else {
          color[d] = h2(x, y, 7 + state.ring) % COLORS;
          seed[d] = h2(x, y, 99);
          const r = h2(x, y, state.ring * 17 + 5) / 255;
          const wP = Math.min(0.09, 0.04 + state.ring * 0.008);
          const vP = Math.min(0.09, 0.025 + state.ring * 0.008);
          if (r < wP) special[d] = WALL;
          else if (r < wP + vP) special[d] = VOID;
          else if (r < wP + vP + 0.025) special[d] = ANCHOR;
          else if (r < wP + vP + 0.055) special[d] = PRISM;
          else special[d] = NORMAL;
        }
      }
    }
    grid = { bound: newBound, stride, color, owned, special, seed };
    fullRebuild = true;
  }

  function pushUndo() {
    history.push({
      ring: state.ring, moves: state.moves, score: state.score,
      combo: state.combo, turns: state.turns, currentColor: state.currentColor,
      bound: grid.bound,
      color: new Uint8Array(grid.color), owned: new Uint8Array(grid.owned),
      special: new Uint8Array(grid.special), seed: new Uint8Array(grid.seed)
    });
    if (history.length > 8) history.shift();
    ui.undo.disabled = false;
  }

  function undo() {
    if (!history.length || state.gameOver) return;
    const h = history.pop();
    state.ring = h.ring; state.moves = h.moves; state.score = h.score;
    state.combo = h.combo; state.turns = h.turns; state.currentColor = h.currentColor;
    grid = { bound: h.bound, stride: h.bound * 2 + 1, color: h.color, owned: h.owned, special: h.special, seed: h.seed };
    ensureScratch(grid.stride * grid.stride);
    fullRebuild = true;
    ui.undo.disabled = history.length === 0;
    refreshUI(); draw();
  }

  function startGame() {
    state.ring = 1; state.moves = START_MOVES; state.score = 0;
    state.combo = 0; state.turns = 0; state.gameOver = false;
    state.camX = 0; state.camY = 0; state.zoom = 1.1;
    history = []; dirty.clear(); ui.undo.disabled = true;
    ui.modal.classList.remove("open");

    alloc(6, null);
    const c0 = grid.color[idx(0, 0)];
    state.currentColor = c0;
    for (let y = -1; y <= 0; y++) {
      for (let x = -1; x <= 0; x++) {
        const i = idx(x, y);
        grid.color[i] = c0; grid.owned[i] = 1; grid.special[i] = NORMAL;
      }
    }
    flood(c0, true);
    refreshUI(); draw();
    toast("13 moves • +8 per expansion • 4 center tiles");
  }

  function ownedCount() {
    let n = 0;
    for (let i = 0; i < grid.owned.length; i++) if (grid.owned[i]) n++;
    return n;
  }

  function bfs(targetColor) {
    const { bound, stride, color, owned, special } = grid;
    const { vis, qx, qy } = scratch;
    vis.fill(0);
    let head = 0, tail = 0;

    for (let y = -bound; y <= bound; y++) {
      for (let x = -bound; x <= bound; x++) {
        const i = (y + bound) * stride + (x + bound);
        if (owned[i]) { vis[i] = 1; qx[tail] = x; qy[tail] = y; tail++; }
      }
    }

    const found = [];
    while (head < tail) {
      const cx = qx[head], cy = qy[head]; head++;
      for (let d = 0; d < 4; d++) {
        const nx = cx + DIRS[d][0], ny = cy + DIRS[d][1];
        if (!inside(nx, ny, bound)) continue;
        const ni = (ny + bound) * stride + (nx + bound);
        if (!vis[ni] && special[ni] !== WALL && color[ni] === targetColor) {
          vis[ni] = 1; found.push({ x: nx, y: ny, i: ni });
          qx[tail] = nx; qy[tail] = ny; tail++;
        }
      }
    }
    return found;
  }

  function flood(newColor, init = false) {
    if (!init) pushUndo();
    const { bound, stride, color, owned, special } = grid;

    for (let i = 0; i < owned.length; i++) {
      if (owned[i] && special[i] !== WALL) { color[i] = newColor; dirty.add(i); }
    }

    const cap = bfs(newColor);
    let mult = 1, prismMove = 0, hitAnchor = false;

    for (let k = 0; k < cap.length; k++) {
      const { i } = cap[k];
      owned[i] = 1; dirty.add(i);
      const sp = special[i];
      if (sp === PRISM) { prismMove = 1; mult = 2; special[i] = NORMAL; }
      else if (sp === VOID) { special[i] = NORMAL; }
      else if (sp === ANCHOR) { hitAnchor = true; mult = 2; special[i] = NORMAL; }
    }

    if (hitAnchor && cap.length) {
      const base = cap.length;
      for (let k = 0; k < base; k++) {
        for (let d = 0; d < 4; d++) {
          const nx = cap[k].x + DIRS[d][0], ny = cap[k].y + DIRS[d][1];
          if (!inside(nx, ny, bound)) continue;
          const ni = (ny + bound) * stride + (nx + bound);
          if (!owned[ni] && special[ni] !== WALL && color[ni] === newColor) {
            owned[ni] = 1; special[ni] = NORMAL; dirty.add(ni);
            cap.push({ x: nx, y: ny, i: ni });
          }
        }
      }
    }

    state.currentColor = newColor;
    if (init) return;

    state.turns++;
    state.moves = state.moves - 1 + prismMove;

    if (cap.length) {
      state.combo++;
      state.score += cap.length * 15 * state.ring * mult + state.combo * 10;
      beep(cap.length, state.combo, hitAnchor);
    } else {
      state.combo = 0;
      beep(0, 0, false);
    }

    const interval = state.ring >= 3 ? 2 : 3;
    if (state.turns % interval === 0) {
      const voids = [];
      for (let y = -bound; y <= bound; y++) {
        for (let x = -bound; x <= bound; x++) {
          const i = (y + bound) * stride + (x + bound);
          if (special[i] === VOID) voids.push({ x, y });
        }
      }
      for (let v = 0; v < voids.length; v++) {
        const cands = [];
        for (let d = 0; d < 4; d++) {
          const nx = voids[v].x + DIRS[d][0], ny = voids[v].y + DIRS[d][1];
          if (!inside(nx, ny, bound)) continue;
          const ni = (ny + bound) * stride + (nx + bound);
          if (!owned[ni] && special[ni] === NORMAL) cands.push(ni);
        }
        if (cands.length) {
          const pick = cands[h2(voids[v].x, voids[v].y, state.turns) % cands.length];
          special[pick] = VOID; dirty.add(pick);
        }
      }
    }

    const total = stride * stride;
    const ratio = ownedCount() / total;
    if (ratio >= targetRatio(state.ring)) {
      state.ring++;
      state.moves += EXPAND_MOVES;
      state.score += 200 * state.ring;
      alloc(grid.bound + 3, grid);
      state.zoom = Math.max(0.24, Math.min(1.05, (Math.min(viewport.clientWidth, viewport.clientHeight) * 0.72) / (grid.stride * TILE)));
      toast(`Ring ${state.ring}! +${EXPAND_MOVES} moves`);
    } else if (state.moves <= 0) {
      state.gameOver = true;
      ui.mRing.textContent = state.ring;
      ui.mTiles.textContent = ownedCount();
      ui.mScore.textContent = state.score;
      ui.mTitle.textContent = `Out of Moves (Ring ${state.ring})`;
      ui.mDesc.textContent = `You painted ${ownedCount()} tiles.`;
      ui.modal.classList.add("open");
    }

    refreshUI();
    draw();
  }

  function getWallStamp(sz) {
    const qsz = Math.max(8, Math.round(sz));
    if (wallStampSize === qsz) return wallStamp;
    wallStampSize = qsz;
    wallStamp.width = qsz;
    wallStamp.height = qsz;
    wctx.fillStyle = "#111318";
    wctx.fillRect(0, 0, qsz, qsz);
    wctx.strokeStyle = "#64748b";
    wctx.lineWidth = Math.max(1.5, qsz * 0.11);
    for (let o = -qsz; o <= qsz * 2; o += qsz * 0.36) {
      wctx.beginPath();
      wctx.moveTo(o, 0);
      wctx.lineTo(o - qsz, qsz);
      wctx.stroke();
    }
    return wallStamp;
  }

  function drawTile(c, i, cx, cy, sz, hex) {
    const h = sz / 2;
    const sp = grid.special[i];

    if (sp === WALL) {
      c.drawImage(getWallStamp(sz), cx - h, cy - h, sz, sz);
      return;
    }

    c.save();
    c.beginPath(); c.rect(cx - h, cy - h, sz, sz); c.clip();
    c.fillStyle = hex;
    c.fillRect(cx - h, cy - h, sz, sz);

    const s = grid.seed[i] / 255;
    c.strokeStyle = grid.owned[i] ? "rgba(255,255,255,0.28)" : "rgba(0,0,0,0.22)";
    c.lineWidth = Math.max(1, sz * 0.055);

    if (state.weave === "geo") {
      c.strokeRect(cx - h * 0.55, cy - h * 0.55, sz * 0.55, sz * 0.55);
    } else if (state.weave === "rings") {
      c.beginPath(); c.arc(cx, cy, h * (0.35 + s * 0.35), 0, Math.PI * 2); c.stroke();
    } else {
      c.beginPath(); c.moveTo(cx - h, cy + (s - 0.5) * h); c.lineTo(cx + h, cy - (s - 0.5) * h); c.stroke();
    }

    if (grid.owned[i]) {
      c.strokeStyle = "rgba(255,255,255,0.4)"; c.lineWidth = 1.5;
      c.strokeRect(cx - h + 0.5, cy - h + 0.5, sz - 1, sz - 1);
    }

    c.textAlign = "center"; c.textBaseline = "middle";
    if (sp === PRISM) {
      c.fillStyle = "#fff"; c.font = `bold ${Math.round(sz * 0.45)}px sans-serif`; c.fillText("✦", cx, cy + 1);
    } else if (sp === ANCHOR) {
      c.fillStyle = "#fde047"; c.font = `bold ${Math.round(sz * 0.45)}px sans-serif`; c.fillText("◈", cx, cy + 1);
    } else if (sp === VOID) {
      c.fillStyle = "rgba(10,10,14,0.82)"; c.fillRect(cx - h, cy - h, sz, sz);
      c.fillStyle = "#ff4d6d"; c.font = `bold ${Math.round(sz * 0.42)}px sans-serif`; c.fillText("⦻", cx, cy + 1);
    } else if (state.glyphs) {
      c.fillStyle = "rgba(255,255,255,0.85)"; c.font = `bold ${Math.round(sz * 0.32)}px sans-serif`;
      c.fillText(GLYPHS[grid.color[i] % COLORS], cx, cy + 0.5);
    }
    c.restore();
  }

  function syncArt() {
    const pal = PALETTES[state.palette];
    const span = grid.stride * TILE + 8;
    if (art.width !== span || art.height !== span) { art.width = span; art.height = span; fullRebuild = true; }
    const o = span / 2;

    if (fullRebuild) {
      actx.clearRect(0, 0, span, span);
      for (let y = -grid.bound; y <= grid.bound; y++) {
        for (let x = -grid.bound; x <= grid.bound; x++) {
          const i = (y + grid.bound) * grid.stride + (x + grid.bound);
          drawTile(actx, i, o + x * TILE, o + y * TILE, TILE - 1.5, pal.c[grid.color[i]]);
        }
      }
      dirty.clear(); fullRebuild = false;
      return;
    }

    for (const i of dirty) {
      const x = (i % grid.stride) - grid.bound;
      const y = Math.floor(i / grid.stride) - grid.bound;
      if (!inside(x, y)) continue;
      const cx = o + x * TILE, cy = o + y * TILE;
      actx.clearRect(cx - TILE / 2, cy - TILE / 2, TILE, TILE);
      drawTile(actx, i, cx, cy, TILE - 1.5, pal.c[grid.color[i]]);
    }
    dirty.clear();
  }

  function draw() {
    syncArt();
    const w = Math.max(1, viewport.clientWidth);
    const h = Math.max(1, viewport.clientHeight);
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    if (canvas.width !== w * dpr || canvas.height !== h * dpr) {
      canvas.width = w * dpr; canvas.height = h * dpr;
    }

    ctx.save();
    ctx.scale(dpr, dpr);
    ctx.fillStyle = PALETTES[state.palette].bg;
    ctx.fillRect(0, 0, w, h);
    ctx.translate(w / 2 - state.camX * state.zoom, h / 2 - state.camY * state.zoom);
    ctx.scale(state.zoom, state.zoom);
    ctx.drawImage(art, -art.width / 2, -art.height / 2);
    const f = grid.stride * TILE;
    ctx.strokeStyle = "rgba(255,255,255,0.16)"; ctx.lineWidth = 2;
    ctx.strokeRect(-f / 2, -f / 2, f, f);
    ctx.restore();
  }

  function refreshUI() {
    ui.moves.textContent = state.moves;
    ui.moves.className = state.moves <= 3 ? "danger" : "good";
    ui.ring.textContent = state.ring;

    const total = grid.stride * grid.stride;
    const own = ownedCount();
    const pct = own / total;
    const req = targetRatio(state.ring);
    ui.bar.style.width = `${Math.min(100, (pct / req) * 100)}%`;
    ui.area.textContent = `${own} (${Math.round(pct * 100)}%)`;
    ui.score.textContent = state.score;

    let voids = 0;
    for (let i = 0; i < grid.special.length; i++) if (grid.special[i] === VOID) voids++;
    const thr = Math.min(100, Math.round((voids / total) * 500));
    ui.threat.textContent = `${thr}%`;
    ui.threat.className = thr >= 30 ? "danger" : "";

    let best = -1, bestW = -1;
    const gains = new Array(COLORS).fill(0);
    if (state.hints) {
      for (let c = 0; c < COLORS; c++) {
        if (c === state.currentColor) continue;
        const cap = bfs(c);
        gains[c] = cap.length;
        let wgt = cap.length;
        for (let k = 0; k < cap.length; k++) {
          const sp = grid.special[cap[k].i];
          if (sp === PRISM) wgt += 2;
          else if (sp === ANCHOR) wgt += 3;
        }
        if (wgt > bestW) { bestW = wgt; best = c; }
      }
    }

    ui.swatches.innerHTML = "";
    PALETTES[state.palette].c.forEach((hex, c) => {
      const b = document.createElement("button");
      const cur = c === state.currentColor;
      b.className = "swatch" + (cur ? " current" : "") + (state.hints && c === best && !cur ? " hint" : "");
      b.style.background = hex;
      b.disabled = cur || state.gameOver;
      b.innerHTML = `<span class="k">${c + 1}</span>` + (state.hints && !cur ? `<span class="g">+${gains[c]}</span>` : "");
      b.onclick = () => flood(c, false);
      ui.swatches.appendChild(b);
    });
  }

  function savePNG() {
    const pal = PALETTES[state.palette];
    const tsz = 44, pad = 32;
    const out = document.createElement("canvas");
    out.width = grid.stride * tsz + pad * 2;
    out.height = grid.stride * tsz + pad * 2;
    const o = out.getContext("2d");
    o.fillStyle = pal.bg; o.fillRect(0, 0, out.width, out.height);
    const ox = out.width / 2, oy = out.height / 2;
    for (let y = -grid.bound; y <= grid.bound; y++) {
      for (let x = -grid.bound; x <= grid.bound; x++) {
        const i = (y + grid.bound) * grid.stride + (x + grid.bound);
        drawTile(o, i, ox + x * tsz, oy + y * tsz, tsz, pal.c[grid.color[i]]);
      }
    }
    out.toBlob((blob) => {
      if (!blob) return;
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.download = `chroma-loom-ring-${state.ring}.png`;
      a.href = url;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      toast("PNG saved");
    }, "image/png");
  }

  viewport.onpointerdown = (e) => { state.dragging = true; state.lx = e.clientX; state.ly = e.clientY; state.scx = state.camX; state.scy = state.camY; };
  window.onpointermove = (e) => {
    if (!state.dragging) return;
    state.camX = state.scx - (e.clientX - state.lx) / state.zoom;
    state.camY = state.scy - (e.clientY - state.ly) / state.zoom;
    scheduleDraw();
  };
  window.onpointerup = () => { state.dragging = false; };
  viewport.onwheel = (e) => {
    e.preventDefault();
    state.zoom = Math.max(0.22, Math.min(2.6, state.zoom * (e.deltaY < 0 ? 1.12 : 0.89)));
    scheduleDraw();
  };
  window.onresize = scheduleDraw;

  ui.zoomIn.onclick = () => { state.zoom = Math.min(2.6, state.zoom * 1.2); draw(); };
  ui.zoomOut.onclick = () => { state.zoom = Math.max(0.22, state.zoom * 0.83); draw(); };
  ui.center.onclick = () => { state.camX = 0; state.camY = 0; draw(); };
  ui.palette.onchange = (e) => { state.palette = e.target.value; fullRebuild = true; refreshUI(); draw(); };
  ui.weave.onchange = (e) => { state.weave = e.target.value; fullRebuild = true; draw(); };
  ui.undo.onclick = undo;
  ui.hints.onclick = () => { state.hints = !state.hints; ui.hints.classList.toggle("on", state.hints); refreshUI(); };
  ui.glyphs.onclick = () => { state.glyphs = !state.glyphs; ui.glyphs.classList.toggle("on", state.glyphs); fullRebuild = true; draw(); };
  ui.sound.onclick = () => { soundOn = !soundOn; ui.sound.classList.toggle("on", soundOn); };
  ui.sound.classList.add("on");
  ui.save.onclick = savePNG;
  ui.mSave.onclick = savePNG;
  ui.reset.onclick = startGame;
  ui.mRetry.onclick = startGame;

  window.onkeydown = (e) => {
    if (e.key === "z" || e.key === "Z") { undo(); return; }
    if (state.gameOver) return;
    const c = parseInt(e.key, 10) - 1;
    if (c >= 0 && c < COLORS && c !== state.currentColor) flood(c, false);
  };

  startGame();
})();
</script>
</body>
</html>
